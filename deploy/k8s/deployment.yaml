apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-event-pipeline
  labels:
    app: payment-event-pipeline
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-event-pipeline
  template:
    metadata:
      labels:
        app: payment-event-pipeline
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: app
          image: payment-event-pipeline:0.1.0
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: payment-event-pipeline-config
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: payment-event-pipeline
spec:
  selector:
    app: payment-event-pipeline
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-event-pipeline-config
data:
  KAFKA_BOOTSTRAP_SERVERS: "kafka.kafka.svc.cluster.local:9092"
  KAFKA_GROUP_ID: "payment-ledger"
